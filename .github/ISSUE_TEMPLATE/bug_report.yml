name: Bug report
description: Report reproducible unexpected behavior
title: "[Bug]: "
body:
  - type: markdown
    attributes:
      value: |
        Thank you for reporting a bug. Do not include secrets, personal data,
        health information, or unsanitized logs. Report security vulnerabilities
        through the private link in the repository security policy.
  - type: dropdown
    id: platform
    attributes:
      label: Platform
      options:
        - iOS
        - Android
        - Shared mobile application
        - Not yet platform-specific
        - Other
    validations:
      required: true
  - type: input
    id: phone_model
    attributes:
      label: Phone model
      description: Enter the phone model, or "Not applicable".
      placeholder: Pixel 10
    validations:
      required: true
  - type: input
    id: system_version
    attributes:
      label: Operating system version
      description: Enter the iOS or Android version, or "Not applicable".
      placeholder: Android 17
    validations:
      required: true
  - type: dropdown
    id: data_source
    attributes:
      label: Data source
      options:
        - HealthKit
        - Health Connect
        - Local storage or synchronization core
        - Future provider integration
        - Not related to health data
        - Unknown
    validations:
      required: true
  - type: dropdown
    id: metric
    attributes:
      label: Metric
      options:
        - Steps
        - Heart rate
        - Sleep
        - Workouts
        - More than one metric
        - Not applicable
    validations:
      required: true
  - type: input
    id: project_version
    attributes:
      label: Project version or commit
      description: Provide a release, branch, or commit if one exists.
      placeholder: main at abc1234
    validations:
      required: true
  - type: textarea
    id: reproduction
    attributes:
      label: Steps to reproduce
      description: Provide the smallest reliable sequence that shows the problem.
      placeholder: |
        1. Start from...
        2. Open...
        3. Observe...
    validations:
      required: true
  - type: textarea
    id: expected
    attributes:
      label: Expected behavior
    validations:
      required: true
  - type: textarea
    id: actual
    attributes:
      label: Actual behavior
    validations:
      required: true
  - type: textarea
    id: logs
    attributes:
      label: Sanitized logs or screenshots
      description: Remove credentials, identifiers, and personal or health data.
  - type: checkboxes
    id: checks
    attributes:
      label: Submission checks
      options:
        - label: I searched existing issues for this problem.
          required: true
        - label: I removed secrets and personal data from this report.
          required: true
        - label: This is not a security vulnerability.
          required: true
